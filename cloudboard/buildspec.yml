version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci
  pre_build:
    commands:
      - echo "Verifying workspace..."
  build:
    commands:
      - echo "Building Next.js application..."
      - npm run build
  post_build:
    commands:
      - echo "Build completed successfully on `date`"
      - |
        TARGET_BUCKET="${S3_BUCKET:-cloudboard-website}"
        echo "Syncing assets to S3 bucket: $TARGET_BUCKET"
        aws s3 sync out/ s3://$TARGET_BUCKET --delete --cache-control 'public, max-age=31536000, immutable' --exclude '*.html'
        aws s3 sync out/ s3://$TARGET_BUCKET --delete --cache-control 'public, max-age=0, must-revalidate' --include '*.html'

artifacts:
  files:
    - '**/*'
  base-directory: out
