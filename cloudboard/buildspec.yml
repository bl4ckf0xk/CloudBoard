version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci
  pre_build:
    commands:
      - echo "Verifying workspace..."
  build:
    commands:
      - echo "Building Next.js application..."
      - npm run build
  post_build:
    commands:
      - echo "Build completed successfully on `date`"
      - |
        if [ -n "$S3_BUCKET" ]; then
          echo "Syncing assets to S3 bucket: $S3_BUCKET"
          aws s3 sync out/ s3://$S3_BUCKET --delete
        fi

artifacts:
  files:
    - '**/*'
  base-directory: out
